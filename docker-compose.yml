services:
  app:
    build: .
    ports:
      - "7000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/openpost?schema=public
      - DB_PROVIDER=postgresql
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=openpost
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openpost"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - openpost_data:/app/uploads
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  openpost_data:
    external: true

networks:
  default:
    name: localhost
    external: true

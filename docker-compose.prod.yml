services:
  app:
    container_name: openpost-api
    hostname: openpost-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "7777:3000"
    # Semua secret dibaca dari environment host / file .env yang TIDAK di-commit.
    # Salin .env.prod.example menjadi .env.prod dan isi nilainya di server deploy.
    # JANGAN menulis password/API key langsung di file ini (ter-commit ke git).
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - DB_PROVIDER=${DB_PROVIDER:-postgresql}
      - APP_URL=${APP_URL:-https://openpost.hyvercode.com}
      - API_ONLY=${API_ONLY:-false}

    # deploy:
    #   resources:
    #     limits:
    #       memory: 2G
    #     reservations:
    #       memory: 256M

networks:
  default:
    name: localhost
    external: true

name: Security Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  security:
    name: Secrets, audit & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fail only on critical (repo currently has 0 critical; high/moderate
      # are mostly build-time deps tracked for phased remediation).
      - name: Dependency audit (fail on critical)
        run: npm audit --audit-level=critical

      - name: Type check
        run: npx tsc --noEmit

      - name: Security + unit tests
        run: npm test
        env:
          JWT_SECRET: ci-test-secret-that-is-long-enough-32
